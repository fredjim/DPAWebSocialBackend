# Perfil DEV — sobreescribe valores de application.properties
# Flyway carga también el directorio seed con datos de prueba
spring.flyway.locations=classpath:db/migration,classpath:db/seed

# URL base para construcción dinámica de URLs de medias
app.base-url=http://localhost:9091
app.use-relative-urls=false

# Logging verboso solo en desarrollo: se ve el request/response completo en consola
logging.level.org.zalando.logbook.Logbook=TRACE
logging.level.org.springframework.web=DEBUG
