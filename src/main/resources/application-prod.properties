# Perfil PROD — solo migraciones versionadas, sin seed de desarrollo
spring.flyway.locations=classpath:db/migration
spring.jpa.show-sql=false

# URL base para construcción dinámica de URLs de medias
# Sobreescribir con variable de entorno BASE_URL en el servidor de producción
app.base-url=${BASE_URL:https://dpa.umss.net}
app.use-relative-urls=false

# ─────────────────────────────────────────────
# Logging de producción
# ─────────────────────────────────────────────
# Logbook: NO guardar el body de peticiones exitosas.
# Solo registra request/response a partir de HTTP 400 (errores 4xx/5xx).
logbook.minimum-status=400
logbook.format.style=json
logging.level.org.zalando.logbook.Logbook=INFO

# Niveles generales
logging.level.root=INFO
logging.level.com.infsis.socialpagebackend=INFO
logging.level.org.hibernate=WARN
logging.level.org.springframework.web=WARN
