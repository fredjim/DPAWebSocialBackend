spring.application.name=socialpagebackend

server.port=9091
server.error.include-stacktrace=ON_PARAM

spring.datasource.username=${pgUser}
spring.datasource.password=${pgPassword}
spring.datasource.url=${bdd}
#spring.datasource.username=dev
#spring.datasource.password=12345678
#spring.datasource.url=jdbc:postgresql://localhost:5432/websocial_dpa

spring.jpa.hibernate.ddl-auto=none
spring.sql.init.platform=dpa_dev

# Flyway — migraciones automáticas de BD
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Perfil activo (cambiar a 'prod' en producción)
spring.profiles.active=${SPRING_PROFILE:dev}

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'

spring.sql.init.mode=never

spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB
spring.servlet.multipart.enabled=true
server.tomcat.max-swallow-size=1GB
server.tomcat.max-http-form-post-size=1GB
server.tomcat.max-http-post-size=1GB

security.jwt.expiration-time=10800000

# Cookie del refresh token
# COOKIE_SECURE=true  → obligatorio en producción (requiere HTTPS)
# COOKIE_SAME_SITE=None → necesario si frontend y backend están en dominios distintos (cross-origin)
#                         SameSite=None REQUIERE Secure=true
# COOKIE_SAME_SITE=Strict → usar cuando frontend y backend comparten el mismo dominio (más seguro)
app.auth.cookie.secure=${COOKIE_SECURE:false}
app.auth.cookie.same-site=${COOKIE_SAME_SITE:Strict}

# File Storage Configuration
file.storage.document-upload-dir=${user.dir}/storage/institution/posts/documents/
file.storage.image-upload-dir=${user.dir}/storage/institution/posts/photos/
file.storage.video-upload-dir=${user.dir}/storage/institution/posts/videos/
file.storage.user-profile-upload-dir=${user.dir}/storage/users/photos/
file.storage.max-file-size=52428800
file.storage.max-request-size=104857600
file.storage.allowed-document-types=application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document
file.storage.allowed-image-types=image/jpeg,image/png,image/gif,image/webp
file.storage.allowed-video-types=video/mp4,video/avi,video/mov,video/wmv

# Application URL Configuration (Environment Specific)
app.base-url=${BASE_URL:http://localhost:9091}
app.use-relative-urls=${USE_RELATIVE_URLS:false}
app.api.base-path=${API_BASE_PATH:/api/v1}
app.api.documents-path=${API_DOCUMENTS_PATH:/documents}
app.api.images-path=${API_IMAGES_PATH:/images}
app.api.videos-path=${API_VIDEOS_PATH:/videos}
security.jwt.refresh-expiration-time=259200000

# Niveles base (seguros para prod). El perfil dev los sube para depurar.
logging.level.org.zalando.logbook.Logbook=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# Enmascarado de datos sensibles en logs HTTP (aplica en todos los perfiles)
logbook.masking.enabled=true
logbook.obfuscate.headers=Authorization
logbook.obfuscate.parameters=password
logbook.obfuscate.body.patterns='"password": ".*"'
logbook.format.style=http
logbook.filter.enabled=true

# NOTA: la ruta y rotación de archivos las gestiona logback-spring.xml (LOG_DIR).
# Las antiguas props logging.file / logging.pattern.file fueron eliminadas
# (logging.file está obsoleta en Spring Boot 3).

# ─────────────────────────────────────────────
# Moderation Pipeline Configuration
# ─────────────────────────────────────────────

# Filtro 1 - Blacklist
moderation.blacklist.enabled=true

# Filtro 2 - Perspective API (Google)
# Obtener API key en: https://developers.perspectiveapi.com/
moderation.perspective.enabled=false
moderation.perspective.api-key=${PERSPECTIVE_API_KEY:}
moderation.perspective.url=https://commentanalyzer.googleapis.com/v1alpha1/comments:analyze
moderation.perspective.toxicity-threshold=0.7
moderation.perspective.timeout-ms=5000
moderation.perspective.min-text-length=3

# Filtro 3 - LLM (compatible con cualquier proveedor OpenAI-compatible)
# Para cambiar de proveedor: solo cambia estas 3 variables de entorno
#
#   Ollama local:  LLM_ENDPOINT=http://localhost:11434/v1  LLM_MODEL=llama3.2       LLM_API_KEY=(vacío)
#   DeepSeek:      LLM_ENDPOINT=https://api.deepseek.com/v1  LLM_MODEL=deepseek-chat  LLM_API_KEY=sk-xxx
#   OpenAI:        LLM_ENDPOINT=https://api.openai.com/v1    LLM_MODEL=gpt-4o-mini    LLM_API_KEY=sk-xxx
#   Groq:          LLM_ENDPOINT=https://api.groq.com/openai/v1  LLM_MODEL=llama-3.3-70b-versatile
moderation.llm.enabled=false
moderation.llm.endpoint=${LLM_ENDPOINT:http://localhost:11434/v1}
moderation.llm.api-key=${LLM_API_KEY:}
moderation.llm.model=${LLM_MODEL:llama3.2}
moderation.llm.provider-name=${LLM_PROVIDER_NAME:ollama-local}
moderation.llm.confidence-threshold=0.8
moderation.llm.max-tokens=256
moderation.llm.temperature=0.1
moderation.llm.timeout-ms=15000

# ─────────────────────────────────────────────
# Email (SMTP)
  spring.mail.host=${MAIL_HOST:smtp.gmail.com}
  spring.mail.port=${MAIL_PORT:465}
  spring.mail.username=${MAIL_USERNAME}
  spring.mail.password=${MAIL_PASSWORD}
  spring.mail.properties.mail.smtp.auth=true
  spring.mail.properties.mail.smtp.ssl.enable=true
  spring.mail.properties.mail.smtp.starttls.enable=false
  spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.gmail.com}
  spring.mail.from=${MAIL_FROM:"UMSS" <no-reply@gmail.com>}


# Base del frontend usada SOLO cuando la petición no trae un Origin permitido (llamada no-browser,
# ej. pruebas con curl/Postman sin header Origin). En el flujo normal desde el navegador, el link
# de verificación/reset se construye dinámicamente a partir del Origin de la petición (el subdominio
# real del tenant, ej. https://dpa.umss.dev), validado contra la misma lista que usa CORS
# (app.cors.allowed-origins / app.cors.allowed-domains) — así cada institución recibe el link a SU
# propio subdominio, no a un dominio único fijo. Antes esta URL reutilizaba por error la misma
# variable BASE_URL que usa app.base-url (el dominio de la API), heredando ese dominio en vez del
# frontend correcto.
app.frontend.fallback-url=${FRONTEND_FALLBACK_URL:http://localhost:4200}


# ─────────────────────────────────────────────
# Meta Graph API
meta.graph-api.url=https://graph.facebook.com
meta.graph-api.video-url=https://graph-video.facebook.com

# Clave AES-256 (exactamente 32 chars) para cifrar tokens de Facebook en BD
security.facebook.token-secret=${FACEBOOK_TOKEN_SECRET:cambia-esta-clave-insegura-32chr}

# ─────────────────────────────────────────────
# Rate limiting anti fuerza bruta (endpoints /api/auth/*)
# capacity = nº máx. de peticiones por IP dentro de window-seconds. Responde 429 al exceder.
security.rate-limit.enabled=true

security.rate-limit.login.capacity=5
security.rate-limit.login.window-seconds=60

security.rate-limit.root-login.capacity=5
security.rate-limit.root-login.window-seconds=60

security.rate-limit.register.capacity=5
security.rate-limit.register.window-seconds=3600

security.rate-limit.forgot-password.capacity=3
security.rate-limit.forgot-password.window-seconds=3600

security.rate-limit.reset-password.capacity=10
security.rate-limit.reset-password.window-seconds=900

security.rate-limit.verify-email.capacity=10
security.rate-limit.verify-email.window-seconds=3600

security.rate-limit.refresh.capacity=60
security.rate-limit.refresh.window-seconds=3600

# Bloqueo de cuenta: tras N contraseñas incorrectas para un mismo email, se bloquea M minutos.
security.rate-limit.lockout.max-failed-attempts=5
security.rate-limit.lockout.lock-minutes=15

# ─────────────────────────────────────────────
# CORS
# allowed-origins: orígenes EXACTOS permitidos (entornos sin subdominio real, ej. localhost).
# allowed-domains: dominios BASE permitidos — cualquier subdominio de institución bajo estos
#                   dominios queda permitido automáticamente (dpa.umss.dev, dube.umss.dev,
#                   nueva-institucion.umss.dev, ...). Agregar una institución nueva bajo un
#                   dominio ya listado aquí NO requiere reiniciar el backend.
# Solo hace falta editar y reiniciar si se agrega un dominio RAÍZ completamente nuevo.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:4200,http://127.0.0.1:8080,http://localhost:4201}
app.cors.allowed-domains=${CORS_ALLOWED_DOMAINS:umss.dev,umss.edu.bo}
